; ── Shared defaults ───────────────────────────────────────────────────────────
[env]
platform = espressif32
board_build.partitions = huge_app.csv
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    bblanchon/ArduinoJson @ ^7.2.0

; ── ESP32 dev board (original) ────────────────────────────────────────────────
[env:esp32dev]
board = esp32dev
monitor_port = /dev/tty.usbserial-*

; ── ESP32-C3 Super Mini ───────────────────────────────────────────────────────
; BF_SERIAL = Serial1 (GPIO4 TX → FC, GPIO5 RX), DBG_SERIAL = Serial (USB CDC).
; Default MSP pins: wire GPIO4 → FC UART RX.
;
; The C3 uses the USB Serial/JTAG peripheral (not a separate USB-UART chip).
; esptool must use --before=usb_reset to enter the ROM bootloader; the normal
; DTR/RTS reset used for UART-based boards does not work over USB CDC.
[env:esp32c3supermini]
board = lolin_c3_mini
monitor_port = /dev/tty.usbmodem*
upload_protocol = esptool
upload_speed = 460800
upload_flags =
    --before=usb_reset
    --after=hard_reset
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
