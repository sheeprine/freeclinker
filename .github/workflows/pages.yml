name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Download latest firmware release
        run: |
          mkdir -p web/firmware
          gh release download \
            --repo ${{ github.repository }} \
            --pattern "*.bin" \
            --dir web/firmware \
            2>/dev/null || echo "No release assets yet, skipping firmware download"
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/

      - uses: actions/deploy-pages@v4
        id: deploy
