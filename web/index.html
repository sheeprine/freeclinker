<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DJI Action Bridge — Config</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #141414;
      color: #d4d4d4;
      font: 14px/1.5 'Courier New', monospace;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      background: #1e1e1e;
      border-bottom: 1px solid #2d2d2d;
      flex-shrink: 0;
    }

    .brand {
      font-size: 13px;
      font-weight: bold;
      color: #60a5fa;
      margin-right: auto;
    }

    label { font-size: 12px; color: #888; display: flex; align-items: center; gap: 6px; }

    select {
      background: #2a2a2a;
      color: #d4d4d4;
      border: 1px solid #3a3a3a;
      border-radius: 4px;
      padding: 3px 6px;
      font: inherit;
      font-size: 12px;
    }

    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #555;
      flex-shrink: 0;
    }
    .dot.connected { background: #4ade80; box-shadow: 0 0 6px #4ade8088; }

    #statusText { font-size: 12px; color: #666; }
    #statusText.connected { color: #4ade80; }

    button {
      font: inherit;
      font-size: 12px;
      padding: 4px 12px;
      border-radius: 4px;
      border: 1px solid #3a3a3a;
      background: #2a2a2a;
      color: #d4d4d4;
      cursor: pointer;
      transition: background 0.1s;
    }
    button:hover:not(:disabled) { background: #383838; }
    button:disabled { opacity: 0.35; cursor: default; }
    button.primary { background: #1d4ed8; border-color: #2563eb; color: #fff; }
    button.primary:hover:not(:disabled) { background: #2563eb; }
    button.danger  { background: #7f1d1d; border-color: #991b1b; color: #fca5a5; }
    button.danger:hover:not(:disabled)  { background: #991b1b; }

    /* ── Terminal ── */
    #terminal {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      scroll-behavior: smooth;
    }

    .line {
      white-space: pre-wrap;
      word-break: break-all;
      line-height: 1.55;
    }
    .line.sys  { color: #6b7280; }
    .line.cmd  { color: #60a5fa; }
    .line.err  { color: #f87171; }
    .line.warn { color: #fbbf24; }

    /* ── Input bar ── */
    .input-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-top: 1px solid #2d2d2d;
      background: #1a1a1a;
      flex-shrink: 0;
    }

    .prompt { color: #4b5563; user-select: none; }

    #cmdInput {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #60a5fa;
      font: inherit;
      caret-color: #60a5fa;
    }
    #cmdInput::placeholder { color: #374151; }
    #cmdInput:disabled { opacity: 0.3; }

    /* ── No-serial notice ── */
    #noSerial {
      display: none;
      position: fixed;
      inset: 0;
      background: #141414ee;
      place-items: center;
      font-size: 15px;
      color: #f87171;
      text-align: center;
      line-height: 2;
    }
    #noSerial.show { display: grid; }
  </style>
</head>
<body>

<header>
  <span class="brand">DJI Action Bridge</span>

  <label>Baud
    <select id="baudRate">
      <option value="115200" selected>115200</option>
      <option value="57600">57600</option>
      <option value="9600">9600</option>
    </select>
  </label>

  <div class="dot" id="dot"></div>
  <span id="statusText">Disconnected</span>

  <button class="primary" id="connectBtn">Connect</button>
  <button class="danger"  id="disconnectBtn" disabled>Disconnect</button>
</header>

<div id="terminal"></div>

<div class="input-bar">
  <span class="prompt">&gt;</span>
  <input id="cmdInput" type="text" placeholder="type a command and press Enter…" disabled autocomplete="off" spellcheck="false">
  <button id="sendBtn" disabled>Send</button>
</div>

<div id="noSerial">
  <div>
    Web Serial API is not available.<br>
    Please use <strong>Chrome</strong> or <strong>Edge</strong> (desktop).
  </div>
</div>

<script>
'use strict';

const terminal     = document.getElementById('terminal');
const cmdInput     = document.getElementById('cmdInput');
const connectBtn   = document.getElementById('connectBtn');
const disconnectBtn= document.getElementById('disconnectBtn');
const sendBtn      = document.getElementById('sendBtn');
const statusText   = document.getElementById('statusText');
const dot          = document.getElementById('dot');
const baudSelect   = document.getElementById('baudRate');

// ── State ──────────────────────────────────────────────────────────────────
let port        = null;
let writer      = null;
let reader      = null;
let keepReading = false;
let lineBuf     = '';

const history = [];
let histIdx   = -1;
let histDraft = '';

// ── Logging ────────────────────────────────────────────────────────────────
function log(text, cls = '') {
  // flush any buffered partial line first if switching classes
  const lines = text.split(/\r?\n/);
  for (let i = 0; i < lines.length; i++) {
    if (i < lines.length - 1 || lines[i] !== '') {
      const div = document.createElement('div');
      div.className = 'line' + (cls ? ' ' + cls : '');
      div.textContent = lines[i];
      terminal.appendChild(div);
    }
  }
  terminal.scrollTop = terminal.scrollHeight;
}

// ── Connect / disconnect ───────────────────────────────────────────────────
async function connect() {
  try {
    port = await navigator.serial.requestPort();
  } catch (e) {
    if (e.name !== 'NotFoundError') log('Error: ' + e.message, 'err');
    return;
  }
  try {
    await port.open({ baudRate: parseInt(baudSelect.value) });
  } catch (e) {
    log('Failed to open port: ' + e.message, 'err');
    port = null;
    return;
  }

  writer = port.writable.getWriter();
  setConnected(true);
  log(`Connected at ${baudSelect.value} baud`, 'sys');
  startReading();
}

async function disconnect() {
  keepReading = false;
  try { await reader?.cancel(); } catch {}
  try { writer?.releaseLock(); }  catch {}
  try { await port?.close(); }    catch {}
  port = writer = reader = null;
  setConnected(false);
  log('Disconnected', 'sys');
}

// ── Read loop ──────────────────────────────────────────────────────────────
async function startReading() {
  keepReading = true;
  const decoder     = new TextDecoderStream();
  const pipePromise = port.readable.pipeTo(decoder.writable);
  reader            = decoder.readable.getReader();
  lineBuf           = '';

  try {
    while (keepReading) {
      const { value, done } = await reader.read();
      if (done) break;
      lineBuf += value;
      const parts = lineBuf.split('\n');
      lineBuf = parts.pop();           // last chunk may be incomplete
      for (const line of parts) log(line.replace(/\r$/, ''));
    }
  } catch {
    // cancelled or port unplugged
  } finally {
    reader.releaseLock();
    await pipePromise.catch(() => {});
    if (keepReading) {                 // unexpected loss
      port = writer = reader = null;
      setConnected(false);
      log('Connection lost', 'err');
    }
  }
}

// ── Write ──────────────────────────────────────────────────────────────────
const encoder = new TextEncoder();

async function sendCommand(cmd) {
  if (!writer) return;
  log('> ' + cmd, 'cmd');
  try {
    await writer.write(encoder.encode(cmd + '\r\n'));
  } catch (e) {
    log('Write error: ' + e.message, 'err');
  }
}

async function sendCurrent() {
  const cmd = cmdInput.value.trim();
  if (!cmd) return;
  history.unshift(cmd);
  if (history.length > 100) history.pop();
  histIdx   = -1;
  histDraft = '';
  cmdInput.value = '';
  await sendCommand(cmd);
}

// ── UI state ───────────────────────────────────────────────────────────────
function setConnected(connected) {
  dot.className          = 'dot' + (connected ? ' connected' : '');
  statusText.textContent = connected ? 'Connected' : 'Disconnected';
  statusText.className   = connected ? 'connected' : '';
  connectBtn.disabled    = connected;
  disconnectBtn.disabled = !connected;
  baudSelect.disabled    = connected;
  cmdInput.disabled      = !connected;
  sendBtn.disabled       = !connected;
  if (connected) setTimeout(() => cmdInput.focus(), 0);
}

// ── Keyboard handling ──────────────────────────────────────────────────────
cmdInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    sendCurrent();
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (histIdx === -1) histDraft = cmdInput.value;
    if (histIdx < history.length - 1) histIdx++;
    cmdInput.value = history[histIdx] ?? histDraft;
    cmdInput.setSelectionRange(cmdInput.value.length, cmdInput.value.length);
  } else if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (histIdx > 0) histIdx--;
    else { histIdx = -1; }
    cmdInput.value = histIdx === -1 ? histDraft : history[histIdx];
    cmdInput.setSelectionRange(cmdInput.value.length, cmdInput.value.length);
  }
});

connectBtn.addEventListener('click', connect);
disconnectBtn.addEventListener('click', disconnect);
sendBtn.addEventListener('click', sendCurrent);

// ── Init ───────────────────────────────────────────────────────────────────
if (!('serial' in navigator)) {
  document.getElementById('noSerial').classList.add('show');
} else {
  log('Open a port to begin.  Type "help" for available commands.', 'sys');
}
</script>
</body>
</html>
